<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>기록으로 생기부 초안</title>
  <link rel="stylesheet" href="scene.css">
  <style>
    /* 마무리: 기록 → 세특 문장 연결망 */
    .net-layer > * { position: absolute; }
    .net { left: 0; top: 0; width: 1920px; height: 1080px; }
    .net-col { font-size: 24px; font-weight: 750; letter-spacing: -.02em; color: var(--muted); }
    .net-col b { color: var(--ink); }
    .net-col.gold b { color: #ffd76a; }
    /* 기록: 작은 한 줄 이름표 */
    .net-rec { width: 430px; text-align: right; transform: translateY(-50%); font-size: 17px; line-height: 1.2; color: #c9d8ee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.02em; }
    .net-rec small { color: var(--accent); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 6px; }
    /* 생기부 문장: 크고 금빛 테두리의 카드 */
    .net-sen { width: 760px; transform: translateY(-50%); padding: 22px 28px 24px; border-radius: 20px; font-size: 29px; line-height: 1.42; font-weight: 600; letter-spacing: -.03em; color: #fff7e0;
      background: linear-gradient(180deg, rgba(58, 46, 16, .92), rgba(28, 24, 14, .92)); border: 2px solid rgba(255, 215, 106, .75); box-shadow: 0 0 0 6px rgba(255, 215, 106, .08), 0 18px 50px rgba(0, 0, 0, .5), 0 0 60px rgba(255, 215, 106, .18); }
    .net-sen small { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; color: #ffd76a; font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
    .net-sen small i { font-style: normal; padding: 2px 10px; border-radius: 999px; background: #ffd76a; color: #2a1f05; }
    .net-foot { left: 0; width: 1920px; top: 1004px; text-align: center; font-size: 23px; color: var(--muted); letter-spacing: -.02em; }
    .net-foot b { color: var(--ink); }
  </style>
  <script type="module" src="draft.js"></script>
</head>
<body></body>
</html>
