name: Release installers (Windows + Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build Tauri bundles
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: nuga-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest 러너에는 Android SDK가 기본 설치됨 (ANDROID_HOME). 부족한 build-tools는 AGP가 자동 설치.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (mobile + wear)
        working-directory: android
        run: chmod +x gradlew && ./gradlew :shared:test :mobile:assembleDebug :wear:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nuga-android
          path: |
            android/mobile/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/mobile/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
